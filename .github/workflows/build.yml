name: build

on:
  push:
    branches: [main]
    tags: ["ep01-*-playtest-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Tests (AUTO + SIM)
        run: GODOT=~/godot/godot ./run_tests.sh

      - name: In-engine autopilot (all four endings)
        run: |
          for e in A_MARA B_THOMAS C_DESTROY D_ADRIAN; do
            ~/godot/godot --headless --path . --fixed-fps 60 -- --autopilot=$e 2>&1 | tee /tmp/ap.log | grep -E "autopilot"
            grep -q "RESULT PASS" /tmp/ap.log
          done

      - name: Export builds
        run: |
          set -e
          mkdir -p build/web build/windows build/linux build/macos
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/Room307.exe
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Room307.x86_64
          ~/godot/godot --headless --path . --export-release "macOS" build/macos/Room307.zip
          cd build
          (cd web && zip -qr ../Room307-web.zip . -x "*.import")
          (cd windows && zip -qr ../Room307-windows.zip .)
          (cd linux && zip -qr ../Room307-linux.zip .)
          cp macos/Room307.zip Room307-macos.zip
          # named human-playtest packages
          mkdir -p pt/mac pt/web
          (cd pt/mac && unzip -q ../../macos/Room307.zip && cp ../../../docs/PLAYTEST_GUIDE.md "HOW_TO_PLAY.md")
          (cd pt/mac && zip -qry ../../ROOM307_EP01_GRAYBOX_PLAYTEST_MAC_v1.zip .)
          cp web/index.* pt/web/ 2>/dev/null || true
          rm -f pt/web/*.import
          (cd pt/web && zip -qr ../../ROOM307_EP01_GRAYBOX_PLAYTEST_WEB_v1.zip .)
          unzip -l ROOM307_EP01_GRAYBOX_PLAYTEST_WEB_v1.zip
          unzip -l ROOM307_EP01_GRAYBOX_PLAYTEST_MAC_v1.zip | head -8
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: room307-builds
          path: build/*.zip

      - name: Publish tagged playtest release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "ROOM 307 · EP01 · graybox human playtest (${{ github.ref_name }})"
          bodyFile: docs/PLAYTEST_GUIDE.md
          artifacts: build/ROOM307_EP01_GRAYBOX_PLAYTEST_MAC_v1.zip,build/ROOM307_EP01_GRAYBOX_PLAYTEST_WEB_v1.zip,build/Room307-windows.zip,build/Room307-linux.zip
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false

      - name: Publish rolling "playtest" release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: ncipollo/release-action@v1
        with:
          tag: playtest
          name: "Room 307 · Episode 01 — playtest build"
          body: |
            Latest graybox build of Episode 01 from `${{ github.sha }}`.
            Web: unzip Room307-web.zip and serve the folder (e.g. `python3 -m http.server`), then open index.html.
            Desktop: Windows / macOS / Linux zips.
          artifacts: build/*.zip
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          commit: ${{ github.sha }}
          makeLatest: true
